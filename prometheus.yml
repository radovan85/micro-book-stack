global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8080']

  - job_name: 'book-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['book-service:9000']

  - job_name: 'genre-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['genre-service:9000']

  - job_name: 'image-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['image-service:9000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']