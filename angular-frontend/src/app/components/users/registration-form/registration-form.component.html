<div class="form-container">
    <h2 class="text-center">Register</h2>
    <form id="registrationForm">
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name">
            <small class="text-danger validationError" id="firstNameError">First name must be between 2 and 30 characters.</small>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter last name">
            <small class="text-danger validationError" id="lastNameError">Last name must be between 2 and 30 characters.</small>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
            <small class="text-danger validationError" id="emailError">Please enter a valid email address.</small>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
            <small class="text-danger validationError" id="passwordError">Password must be at least 6 characters long.</small>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmpass"  placeholder="Confirm password">
        </div>
        <button type="submit" class="btn btn-custom mt-3">Register</button>
    </form>
    
    <!-- Link za login -->
    <p class="text-center mt-3">
        Already have an account? <a routerLink="/login" class="login-link">Login here</a>
    </p>
</div>
