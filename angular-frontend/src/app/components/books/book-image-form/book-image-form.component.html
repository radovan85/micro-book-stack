<div class="container">
    <div class="form-container">
        <h2 class="form-title">Image Form</h2>
        <div class="book-title">
            <h5 [innerHTML]="getCurrentBook().title"></h5>
        </div>
        <form>
            <div class="form-group">
                <label for="bookImage">Book Image:</label>
                <input type="file" id="bookImage" name="bookImage" #imageInput (change)="onFileSelected()">
            </div>
            <div class="form-group">
                <button type="submit" class="upload-btn" [innerHTML]="'Upload'" [disabled]="!getisFileSelected()"></button>
            </div>
        </form>
    </div>
</div>
