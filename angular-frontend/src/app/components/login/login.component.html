<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg login-card">
        <h2 class="text-center text-primary fw-bold">Welcome Back!</h2>
        <p class="text-center text-muted">Please login to continue</p>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="text" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
            
            <!-- Poruka o grešci -->
            <span id="alertMessage" class="text-danger d-block text-center mt-3" style="visibility: hidden;">
                The username or password is incorrect.
            </span>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted">Don't have an account? <a class="text-primary fw-bold" routerLink="/register">Register here</a></p>
        </div>
    </div>
</div>
