<div class="form-container">
    <h2 class="text-center">Add Genre</h2>
    <form id="genreForm">
        <div class="mb-3">
            <label for="name" class="form-label">Genre Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter genre name">
            <small class="text-danger validationError" id="nameError">Genre name must be between 3 and 40 characters.</small>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter genre description"></textarea>
            <small class="text-danger validationError" id="descriptionError">Description must be between 3 and 100 characters.</small>
        </div>
        <button type="submit" class="btn btn-custom">Save Genre</button>
    </form>
</div>
